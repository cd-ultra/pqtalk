name = "pqtalk-server"
main = "src/worker.js"
compatibility_date = "2026-11-01"

[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

[[durable_objects.bindings]]
name = "BLOB"
class_name = "Blob"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# SQLite-backed Durable Objects are available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Mailbox", "Blob", "Room"]
